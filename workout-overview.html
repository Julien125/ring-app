  * { box-sizing: border-box; margin: 0; padding: 0; }

  .push .day-header .label { color: #f97316; }
  .block { padding: 10px 16px; border-bottom: 1px solid #1f1f1f; }
  .block:last-child { border-bottom: none; }
  .block-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .block-id { font-size: .65rem; font-weight: 700; background: #2a2a2a; color: #888; border-radius: 4px; padding: 1px 6px; }
  .block-label { font-size: .78rem; font-weight: 600; color: #ccc; flex: 1; }
  .block-meta { font-size: .65rem; color: #555; }
  .exercises { list-style: none; display: flex; flex-direction: column; gap: 2px; }
  .exercises li { font-size: .75rem; color: #aaa; padding: 2px 0 2px 10px; border-left: 2px solid #2a2a2a; }
  .exercises li .ex-note { font-size: .65rem; color: #555; display: block; }
  .section-title { font-size: .6rem; text-transform: uppercase; letter-spacing: .08em; color: #444; margin: 8px 0 4px; }
  .warmup-items { list-style: none; display: flex; flex-direction: column; gap: 2px; }
  .warmup-items li { font-size: .72rem; color: #666; padding: 1px 0; }
  .warmup-items li span { color: #444; font-size: .65rem; margin-left: 4px; }

      { id:'C', label:'Legs — Anterior Chain', rounds:2, exercises:[{...EX['bulgarian-split-squat'],note:'Add KB/DB — load it'},{...EX['pistol-squat'],note:'3s descent · eyes closed — proprioception challenge'},{...EX['sissy-squat'],targetReps:12},{...EX['single-leg-calf-raise'],note:'Bent knee — soleus focus'},EX['copenhagen-plank'],{...EX['single-leg-glute-bridge'],note:'Foot elevated · posterior pelvic tilt — APT correction'}] },
      { id:'D', label:'Push Strength', rounds:2, exercises:[EX['hspu'],EX['archer-push-up'],{...EX['ring-fly'],note:'Wide grip — slow eccentric, max pec stretch'},EX['push-up-rto'],EX['russian-push-up']] },
      { id:'E', label:'Shoulder Health & Isolation', rounds:2, exercises:[EX['scapular-push-up-band'],EX['bulgarian-push-up'],EX['cuban-press'],EX['lateral-raise'],EX['ring-overhead-ext'],EX['l-sit'],EX['pallof-press']] },
      { id:'F', label:'Core Finisher', rounds:2, exercises:[EX['hanging-leg-raise'],EX['ab-wheel-rollout'],EX['hollow-body-hold'],EX['dragon-flag'],EX['windshield-wipers'],EX['lateral-plank'],{...EX['decline-crunch-band'],note:'Loaded flexion · posterior pelvic tilt — APT correction'}] },
    ],
  },
  {
    id: 'sat-pull2', day: 'Saturday', type: 'pull', label: 'Pull 2',
    focus: 'Posterior legs · Muscle Up · Back Lever',
    skills: ['muscle-up', 'back-lever'],
    warmup: WARMUP_PULL_SAT,
    supersets: [
      { id:'A', label:'Skill — Muscle Up & Back Lever', rounds:2, exercises:[EX['false-grip-dead-hang'],EX['chest-to-bar'],EX['muscle-up-negative'],EX['360-pull'],EX['german-hang'],EX['back-lever-negative']] },
      { id:'B', label:'Legs — Posterior Chain', rounds:2, exercises:[{...EX['nordic-curl'],targetReps:6,note:'Explosive descent — use hands to push back up if needed'},{...EX['single-leg-deadlift'],note:'Weighted KB · 3s pause at bottom — eccentric emphasis'},{...EX['single-leg-glute-bridge'],targetReps:10,note:'Foot elevated · weighted KB on hip — full glute stretch'},EX['superman-hold']] },
      { id:'C', label:'Strength Volume', rounds:2, exercises:[EX['wide-pull-up'],EX['archer-pull-up'],EX['commande'],EX['ice-cream-maker'],EX['l-sit-pike-press'],EX['back-extension'],EX['tuck-to-l']] },
      { id:'D', label:'Isolation + Health', rounds:2, exercises:[EX['row'],EX['inverted-deadlift'],EX['pelican-curl'],EX['one-arm-ring-curl'],EX['tyi-raise'],EX['face-pull'],EX['ring-support-shrug'],EX['pallof-press'],EX['jefferson-curl'],EX['windshield-wipers']] },
      { id:'E', label:'Core Finisher', rounds:2, exercises:[EX['hanging-leg-raise'],EX['hanging-oblique-twist'],EX['ab-wheel-rollout'],EX['butt-lift'],EX['v-sit-pulse'],EX['plank'],EX['lateral-plank']] },
    ],
  },
];

// ─── Render ────────────────────────────────────────────────
let skillLevels = {};
try { skillLevels = JSON.parse(localStorage.getItem('gymState') || '{}').skillLevels || {}; } catch(e) {}

function currentDrill(skillId) {
  const sp = SKILL_PROGRESSIONS[skillId];
  if (!sp) return null;
  const level = skillLevels[skillId] || 1;
  return sp.progressions.find(p => p.level === level) || sp.progressions[0];
}

const container = document.getElementById('days');

for (const s of SESSIONS) {
  const div = document.createElement('div');
  div.className = `day ${s.type}`;

  const skillBlockHtml = s.skills?.length ? `
    <div class="block" style="border-left:3px solid #6C7FD8;background:#16182a">
      <div class="section-title" style="color:#6C7FD8;margin-bottom:6px">Skill Block</div>
      ${s.skills.map(skillId => {
        const sp = SKILL_PROGRESSIONS[skillId];
        const drill = currentDrill(skillId);
        if (!sp || !drill) return '';
        const level = skillLevels[skillId] || 1;
        return `<div style="margin-bottom:6px">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <span style="font-size:.78rem;font-weight:600;color:#9aadff">${sp.name}</span>
            <span style="font-size:.6rem;color:#555">L${level}/${sp.progressions.length}</span>
          </div>
          <div style="font-size:.72rem;color:#7a8fd4;margin-top:1px">${drill.drill}</div>
          <div style="font-size:.65rem;color:#555;margin-top:1px">${drill.sets}×${drill.type === 'hold' ? drill.targetSecs + 's' : drill.targetReps + ' reps'}</div>
        </div>`;
      }).join('')}
    </div>` : '';

  const supersetHtml = s.supersets.map(ss => {
    const isTabata = !!ss.workSecs;
    return `
    <div class="block">
      <div class="block-header">
        <span class="block-id">${ss.id}</span>
        <span class="block-label">${ss.label}</span>
        <span class="block-meta">${ss.rounds}×${isTabata ? ' · tabata' : ''}</span>
      </div>
      <ul class="exercises">
        ${ss.exercises.map(ex => {
          const note = ex.note || '';
          return `<li>${ex.name}${note ? `<span class="ex-note">${note}</span>` : ''}</li>`;
        }).join('')}
      </ul>
    </div>`;
  }).join('');

  div.innerHTML = `
    <div class="day-header">
      <div class="label">${s.type} · ${s.label}</div>
      <div class="name">${s.day}</div>
      <div class="focus">${s.focus}</div>
    </div>
    <div class="block">
      <div class="section-title">Warmup</div>
      <ul class="warmup-items">${s.warmup.map(w => `<li>${w.name}<span>${w.duration}</span></li>`).join('')}</ul>
    </div>
    ${skillBlockHtml}
    ${supersetHtml}
  `;
  container.appendChild(div);
}
</script>
</body>
</html>
